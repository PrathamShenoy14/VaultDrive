spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/vaultdrive
spring.datasource.username=${DB_USERNAME:vaultdrive}
spring.datasource.password=${DB_PASSWORD}

# Flyway
spring.flyway.enabled=true

# Hibernate
spring.jpa.hibernate.ddl-auto=validate

# JWT configuration
vaultdrive.jwt.secret=${JWT_SECRET}
vaultdrive.jwt.issuer=https://vaultdrive.local
vaultdrive.jwt.access-token-minutes=15

# Object storage (S3-compatible)
storage.s3.endpoint=${S3_ENDPOINT:http://localhost:3900}
storage.s3.region=${S3_REGION:garage}
storage.s3.bucket=${S3_BUCKET:vaultdrive-files}
storage.s3.access-key=${S3_ACCESS_KEY}
storage.s3.secret-key=${S3_SECRET_KEY}

# Outbox publisher is opt-in until local RabbitMQ connectivity is configured.
vaultdrive.outbox.publisher.enabled=${OUTBOX_PUBLISHER_ENABLED:false}
vaultdrive.outbox.publisher.max-attempts=10
vaultdrive.outbox.publisher.max-events-per-poll=20
vaultdrive.outbox.publisher.lease=30s
vaultdrive.outbox.publisher.confirm-timeout=10s
vaultdrive.outbox.publisher.initial-backoff=1s
vaultdrive.outbox.publisher.max-backoff=60s
vaultdrive.outbox.publisher.poll-delay=5s
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.channel-rpc-timeout=5s
spring.rabbitmq.template.retry.enabled=false
spring.rabbitmq.dynamic=false
# Framework connection logs can render credential-bearing AMQP URIs.
# The publisher emits only controlled result codes and event IDs.
logging.level.org.springframework.amqp=OFF
logging.level.com.rabbitmq.client=OFF
