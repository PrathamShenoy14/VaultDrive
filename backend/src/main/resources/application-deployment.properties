# Activate only after reviewing docs/operational-hardening.md and private settings.
vaultdrive.operations.deployment=true
vaultdrive.operations.probes-enabled=true
# Require explicit opt-in of every processor; an omitted flag fails startup.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
server.tomcat.threads.max=64
server.tomcat.threads.min-spare=4
server.tomcat.accept-count=32
server.tomcat.max-connections=256
server.tomcat.connection-timeout=5s
server.forward-headers-strategy=none
spring.datasource.hikari.maximum-pool-size=16
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=15
spring.datasource.hikari.data-source-properties.options=-c statement_timeout=10000 -c lock_timeout=2000
