spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=OFF
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.rabbitmq.dynamic=false
vaultdrive.operator.enabled=true
vaultdrive.operations.deployment=false
vaultdrive.operations.probes-enabled=false
vaultdrive.outbox.publisher.enabled=false
vaultdrive.purge.consumer.enabled=false
vaultdrive.sharing.notifications.consumer.enabled=false
vaultdrive.jobs.worker.enabled=false
vaultdrive.jobs.reconciliation.enabled=false
vaultdrive.multipart.expiry.enabled=false
vaultdrive.jobs.finalization.enabled=false
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=15
spring.datasource.hikari.data-source-properties.options=-c statement_timeout=10000 -c lock_timeout=2000
