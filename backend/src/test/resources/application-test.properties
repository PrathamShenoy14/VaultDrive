spring.application.name=backend-test

# Dedicated integration test database
spring.datasource.url=jdbc:postgresql://localhost:5432/vaultdrive_test
spring.datasource.username=${DB_USERNAME:vaultdrive}
spring.datasource.password=${DB_PASSWORD}
# Cached Spring test contexts must not each reserve a default ten-connection pool.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

# Apply existing migrations to the test database
spring.flyway.enabled=true

# Hibernate must validate, not generate, our schema
spring.jpa.hibernate.ddl-auto=validate

# Required when loading the complete application context
vaultdrive.jwt.secret=${JWT_SECRET}
vaultdrive.jwt.issuer=https://vaultdrive.local
vaultdrive.jwt.access-token-minutes=30

# Existing tests must not publish their committed purge fixtures to RabbitMQ.
vaultdrive.outbox.publisher.enabled=false
vaultdrive.purge.consumer.enabled=false
vaultdrive.jobs.worker.enabled=false
vaultdrive.jobs.reconciliation.enabled=false
vaultdrive.sharing.notifications.consumer.enabled=false
vaultdrive.multipart.expiry.enabled=false
vaultdrive.operations.probes-enabled=false
vaultdrive.jobs.finalization.enabled=false
# Legacy HTTP fixtures share contexts and are not load tests. Dedicated admission tests override these.
vaultdrive.admission.authentication.burst=10000
vaultdrive.admission.authentication.per-second=10000
vaultdrive.admission.multipart.burst=10000
vaultdrive.admission.multipart.per-second=10000
vaultdrive.admission.downloads.burst=10000
vaultdrive.admission.downloads.per-second=10000
vaultdrive.admission.metadata.burst=10000
vaultdrive.admission.metadata.per-second=10000
