spring.application.name=backend-test

# Dedicated integration test database
spring.datasource.url=jdbc:postgresql://localhost:5432/vaultdrive_test
spring.datasource.username=${DB_USERNAME:vaultdrive}
spring.datasource.password=${DB_PASSWORD}

# Apply existing migrations to the test database
spring.flyway.enabled=true

# Hibernate must validate, not generate, our schema
spring.jpa.hibernate.ddl-auto=validate

# Required when loading the complete application context
vaultdrive.jwt.secret=${JWT_SECRET}
vaultdrive.jwt.issuer=https://vaultdrive.local
vaultdrive.jwt.access-token-minutes=15