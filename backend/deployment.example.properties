# Copy to private deployment configuration, review every identity, and supply secrets externally.
# No infrastructure or bucket policy is provisioned by this file.
spring.profiles.active=deployment
spring.datasource.url=jdbc:postgresql://replace-with-postgres-host:5432/vaultdrive
vaultdrive.jwt.issuer=https://replace-with-api-origin
storage.s3.endpoint=https://replace-with-browser-reachable-garage-endpoint
storage.s3.region=garage
storage.s3.bucket=replace-with-existing-bucket
storage.s3.namespace=replace-with-existing-immutable-namespace
spring.rabbitmq.host=replace-with-rabbitmq-host
spring.rabbitmq.virtual-host=replace-with-approved-existing-vhost

vaultdrive.outbox.publisher.enabled=true
vaultdrive.purge.consumer.enabled=true
vaultdrive.sharing.notifications.consumer.enabled=true
vaultdrive.jobs.worker.enabled=true
vaultdrive.jobs.reconciliation.enabled=true
vaultdrive.jobs.finalization.enabled=true
vaultdrive.multipart.expiry.enabled=true
vaultdrive.operations.probes-enabled=true

vaultdrive.jobs.worker.concurrency=2
vaultdrive.multipart.expiry.page-size=20
vaultdrive.multipart.expiry.poll-delay=1m
vaultdrive.jobs.finalization.page-size=20
vaultdrive.jobs.finalization.poll-delay=1m
vaultdrive.operations.probe-delay=15s
vaultdrive.operations.stale-after=2m
vaultdrive.operations.backlog-age=5m
vaultdrive.operations.recovery-age=30m
